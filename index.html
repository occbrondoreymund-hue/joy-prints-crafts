<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Joy Prints & Crafts — Pink Printing Studio | Custom Print Services</title>
  <!-- Google Fonts & simple reset for modern look -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <!-- hero section -->
  <div class="hero">
    <h1><i class="fas fa-palette"></i> Joy Prints & Crafts </h1>
    <p>Custom prints with a delicate touch — high quality, dreamy colors, and every piece is made with a soft heart</p>
  </div>

  <!-- filter buttons section -->
  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-filter="all"><i class="fas fa-crown"></i> All Products</button>
    <button class="filter-btn" data-filter="stationery"><i class="fas fa-envelope-open-text"></i> Stationery</button>
    <button class="filter-btn" data-filter="poster"><i class="fas fa-image"></i> Art Posters</button>
    <button class="filter-btn" data-filter="photo"><i class="fas fa-camera-retro"></i> Photo Prints</button>
    <button class="filter-btn" data-filter="cards"><i class="fas fa-gift"></i> Greeting Cards</button>
  </div>

  <!-- products grid -->
  <div id="productsGrid" class="products-grid"></div>
</div>

<footer class="footer">
  <p>✨ Every print carries a touch of sweetness ✨ | Custom orders @JoyPrints&Crafts</p>
  <p style="margin-top: 6px;"><i class="fas fa-heart" style="color:#f36bae;"></i> Eco-friendly inks · Fast turnaround · Personalized design</p>
</footer>

<script src="script.js"></script>
</body>
</html>
