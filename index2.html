<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Joy Prints & Crafts · Pink Print Studio | Custom Stationery & Art</title>
  <!-- Google Fonts & modern reset -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(145deg, #fff5f9 0%, #ffe6f0 100%);
      color: #3e2a33;
      line-height: 1.4;
      scroll-behavior: smooth;
      transition: background 0.2s, color 0.2s;
    }

    /* DARK MODE (pink dark theme) */
    body.dark {
      background: #1a1218;
      color: #f3e0e8;
    }

    body.dark .product-card {
      background: #2b1e24;
      border-color: #4f3240;
    }

    body.dark .card-img {
      background: linear-gradient(135deg, #2d2028, #251a21);
    }

    body.dark .product-desc,
    body.dark .product-title {
      color: #f5e2eb;
    }

    body.dark .badge-category,
    body.dark .category-badge-img {
      background: #4b2d3a;
      color: #ffbdd4;
    }

    body.dark .filter-btn {
      background: #2e1f26;
      color: #ffc0db;
      border-color: #623e50;
    }

    body.dark .filter-btn.active {
      background: #e75480;
      color: white;
    }

    body.dark .stats-bar {
      border-bottom-color: #623e50;
    }

    body.dark .product-counter {
      background: #322129;
      color: #ffbdd4;
    }

    body.dark .detail-link {
      background: #2e1f26;
      border-color: #e75480;
      color: #ffbcd9;
    }

    body.dark .detail-link:hover {
      background: #e75480;
      color: white;
    }

    body.dark .footer {
      border-top-color: #623e50;
      color: #c28eaa;
    }

    body.dark .filter-hint {
      color: #cf9bb3;
    }

    body.dark .product-modal {
      background: #2a1c23;
      border-color: #e75480;
    }

    body.dark .modal-category {
      background: #4b2d3a;
      color: #ffc2da;
    }

    body.dark .modal-feature {
      background: #322129;
      color: #f5b7cf;
    }

    :root {
      --pink-soft: #ffe2ef;
      --pink-main: #ff9acb;
      --pink-deep: #f36bae;
      --pink-rose: #e75480;
      --pink-dust: #fbc4d8;
      --white: #ffffff;
    }

    /* MAIN CONTAINER */
    .main-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 32px;
    }

    /* hero section - reduced animations, only one main hero */
    .hero {
      text-align: center;
      padding: 1.2rem 0 0.8rem 0;
      animation: fadeDown 0.6s ease forwards;
    }

    .logo-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      position: relative;
    }

    .logo {
      height: auto;
      width: 130px;
      max-width: 130px;
      object-fit: contain;
      filter: drop-shadow(0 8px 16px rgba(231,84,128,0.2));
      transition: transform 0.25s ease, filter 0.25s ease;
      animation: logoFloatGlow 0.8s ease forwards;
    }

    @keyframes logoFloatGlow {
      0% { opacity: 0; transform: scale(0.8) translateY(20px); filter: drop-shadow(0 0 0px rgba(231,84,128,0)); }
      70% { opacity: 1; transform: scale(1.02) translateY(-2px); filter: drop-shadow(0 8px 16px rgba(231,84,128,0.3)); }
      100% { opacity: 1; transform: scale(1) translateY(0); filter: drop-shadow(0 8px 16px rgba(231,84,128,0.2)); }
    }

    .logo:hover {
      transform: scale(1.03);
      filter: drop-shadow(0 12px 24px rgba(231,84,128,0.35));
      cursor: pointer;
    }

    .hero h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 800;
      background: linear-gradient(135deg, #e75480, #ff9acb, #fbc4d8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      animation: textSlideGlow 0.55s ease 0.1s both;
    }

    @keyframes textSlideGlow {
      0% { opacity: 0; transform: translateX(-12px); filter: blur(2px); }
      100% { opacity: 1; transform: translateX(0); filter: blur(0); }
    }

    .hero h1 i {
      background: none;
      -webkit-background-clip: unset;
      background-clip: unset;
      color: #e75480;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      transition: transform 0.2s ease;
    }

    .hero h1:hover i {
      transform: scale(1.05);
    }

    .hero p {
      max-width: 600px;
      margin: 0.6rem auto 0;
      color: #b35c7c;
      font-weight: 450;
      background: rgba(255, 255, 245, 0.7);
      backdrop-filter: blur(4px);
      padding: 0.4rem 1.2rem;
      border-radius: 60px;
      display: inline-block;
      font-size: 0.9rem;
      animation: fadeUpText 0.5s ease 0.2s both;
    }

    @keyframes fadeUpText {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* SEARCH & FILTER BAR */
    .search-filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 2rem 0 1rem;
      align-items: center;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
      max-width: 280px;
    }

    .search-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #e75480;
      font-size: 0.9rem;
    }

    #searchInput {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.4rem;
      border-radius: 200px;
      border: 1px solid #ffc0db;
      background: white;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      outline: none;
      transition: all 0.2s;
    }

    body.dark #searchInput {
      background: #2e1f26;
      border-color: #e75480;
      color: #ffeef4;
    }

    #searchInput:focus {
      border-color: #e75480;
      box-shadow: 0 0 0 3px rgba(231,84,128,0.2);
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .filter-btn {
      background: white;
      border: none;
      padding: 0.6rem 1.6rem;
      border-radius: 200px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #b3416e;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 1px solid #ffc0db;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .filter-btn.active {
      background: var(--pink-deep);
      border-color: var(--pink-deep);
      color: white;
      box-shadow: 0 6px 14px rgba(231, 84, 128, 0.25);
    }

    .filter-btn:focus-visible {
      outline: 3px solid #f36bae;
      outline-offset: 2px;
    }

    .filter-btn:hover:not(.active) {
      background: #ffecf3;
      border-color: #ff9acb;
      transform: translateY(-1px);
    }

    /* DARK MODE TOGGLE BUTTON */
    .dark-toggle {
      background: white;
      border: 1px solid #ffc0db;
      border-radius: 40px;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    body.dark .dark-toggle {
      background: #2e1f26;
      border-color: #e75480;
      color: #ffd9e7;
    }

    /* STATS BAR */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 1.5rem;
      border-bottom: 1.5px dashed #ffcddf;
      padding-bottom: 0.7rem;
    }

    .product-counter {
      background: #ffeef4;
      padding: 0.3rem 1.2rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #c95a86;
    }

    /* PRODUCT GRID - responsive & better layout */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1rem;
      margin: 1.2rem 0 2.5rem;
    }

    /* product card - clickable full area */
    .product-card {
      background: var(--white);
      border-radius: 24px;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
      box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 170, 200, 0.5);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      opacity: 0;
      transform: translateY(8px);
      animation: cardReveal 0.45s ease forwards;
    }

    @keyframes cardReveal {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 30px -12px rgba(231, 84, 128, 0.2), 0 0 0 1px rgba(231,84,128,0.2);
    }

    /* card image */
    .card-img {
      height: 200px;
      background: linear-gradient(135deg, #fff0f7, #ffe6f0);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 3rem;
      position: relative;
    }

    .preview-icon {
      font-size: 2.4rem;
      color: #e75480;
    }

    .category-badge-img {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(4px);
      padding: 4px 12px;
      border-radius: 60px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #e75480;
    }

    .card-content {
      padding: 1rem 1rem 1.1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .product-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: #3a2631;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge-category {
      background: #ffe2ef;
      color: #c95a86;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.25rem 0.8rem;
      border-radius: 50px;
      white-space: nowrap;
    }

    .product-desc {
      font-size: 0.8rem;
      color: #72566a;
      margin: 0.5rem 0 0.9rem;
      line-height: 1.45;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .action-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-top: 0.2rem;
      border-top: 1px solid #ffe2ef;
      padding-top: 0.8rem;
    }

    .detail-link {
      background: none;
      border: 1.5px solid #ffbed6;
      padding: 0.45rem 1.2rem;
      border-radius: 60px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #e75480;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: white;
    }

    .detail-link:focus-visible {
      outline: 3px solid #e75480;
      outline-offset: 2px;
    }

    .detail-link:hover {
      background: #e75480;
      border-color: #e75480;
      color: white;
      transform: translateY(-2px);
    }

    /* responsive tables */
    @media (max-width: 1200px) {
      .products-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 900px) {
      .products-grid { grid-template-columns: repeat(3, 1fr); }
      .card-img { height: 170px; }
    }
    @media (max-width: 640px) {
      .products-grid { grid-template-columns: repeat(2, 1fr); }
      .main-content { padding: 0 16px; }
      .filter-btn { padding: 0.45rem 1rem; font-size: 0.75rem; }
      .card-img { height: 150px; }
    }
    @media (max-width: 480px) {
      /* 2 cards per row, never 1fr */
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 0.8rem; }
      .card-img { height: 140px; font-size: 2rem; }
      .product-title { font-size: 0.9rem; }
    }

    /* MODAL STYLES with smooth transform origin */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(58, 38, 49, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      visibility: hidden;
      opacity: 0;
      transition: visibility 0.2s, opacity 0.25s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .product-modal {
      background: #fffef7;
      max-width: 450px;
      width: 100%;
      border-radius: 40px;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 30px 40px rgba(0, 0, 0, 0.2);
      border: 1px solid #ffcade;
      transform: scale(0.94) translateY(12px);
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.2), opacity 0.25s;
      opacity: 0;
      transform-origin: center;
    }

    .modal-overlay.active .product-modal {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .modal-icon {
      font-size: 3rem;
      margin-bottom: 10px;
      background: #ffeef5;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin-left: auto;
      margin-right: auto;
    }

    .close-modal-btn {
      background: #f36bae;
      border: none;
      padding: 0.6rem 1.5rem;
      border-radius: 50px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .close-modal-btn:focus-visible {
      outline: 3px solid #e75480;
    }

    .no-products {
      text-align: center;
      padding: 2rem;
      background: rgba(255, 230, 240, 0.8);
      border-radius: 50px;
      margin: 1rem 0;
      color: #c56183;
      grid-column: 1 / -1;
    }

    .footer {
      text-align: center;
      padding: 1.5rem 0 2rem;
      border-top: 1px solid #ffd0e1;
      margin-top: 0.5rem;
      color: #c17a97;
      font-size: 0.8rem;
    }

    @keyframes fadeDown {
      0% { opacity: 0; transform: translateY(-12px);}
      100% { opacity: 1; transform: translateY(0);}
    }
    button:focus, a:focus, .filter-btn:focus, .detail-link:focus {
      outline: 3px solid #f36bae;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
<div class="main-content">
  <div class="hero">
    <div class="logo-wrapper">
      <img src="/image/jpc_logo.png" alt="Joy Prints & Crafts Logo" class="logo" onerror="this.onerror=null; this.style.display='none';">
      <h1><i class="fas fa-heart"></i> Joy Prints & Crafts</h1>
    </div>
    <p><i class="fas fa-feather-alt"></i> Fast • Affordable • High-Quality Custom Printing</p>
  </div>

  <div class="search-filter-bar">
    <div class="search-wrapper">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search treasures... e.g., poster, sticker">
    </div>
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-filter="all"><i class="fas fa-crown"></i> All</button>
      <button class="filter-btn" data-filter="stationery"><i class="fas fa-envelope-open-text"></i> Stationery</button>
      <button class="filter-btn" data-filter="poster"><i class="fas fa-image"></i> Posters</button>
      <button class="filter-btn" data-filter="photo"><i class="fas fa-camera-retro"></i> Photo Prints</button>
      <button class="filter-btn" data-filter="cards"><i class="fas fa-gift"></i> Cards</button>
    </div>
    <button class="dark-toggle" id="darkModeToggle" aria-label="Dark mode"><i class="fas fa-moon"></i> Dark</button>
  </div>

  <div class="stats-bar">
    <div class="product-counter"><i class="fas fa-heart"></i> <span id="productCount">0</span> treasures</div>
    <div class="filter-hint"><i class="fas fa-info-circle"></i> tap any card to see details ✨</div>
  </div>

  <div id="productsGrid" class="products-grid"></div>

  <footer class="footer">
    <p>✨ Every print carries a touch of sweetness ✨ | Custom orders @JoyPrints&Crafts</p>
    <p style="margin-top: 6px;"><i class="fas fa-heart" style="color:#f36bae;"></i> Eco-friendly inks · Fast turnaround · Personalized design</p>
  </footer>
</div>

<div id="productModal" class="modal-overlay">
  <div class="product-modal">
    <div class="modal-icon" id="modalIcon"></div>
    <h2 class="modal-product-name" id="modalName"></h2>
    <span class="modal-category" id="modalCategory"></span>
    <p class="modal-desc" id="modalDesc"></p>
    <div class="modal-feature" id="modalFeature">
      <i class="fas fa-star-of-life"></i> Premium craftsmanship
    </div>
    <button class="close-modal-btn" id="closeModalBtn"><i class="fas fa-heart"></i> Close</button>
  </div>
</div>

<script>
  const products = [
    { id: 1, name: "Sakura Letter Set", category: "stationery", description: "Japanese imported art paper, soft cherry blossom pink with gold foil. Includes 10 sheets + 5 envelopes.", icon: "🌸", material: "Cotton blend paper · hand-stitched envelope" },
    { id: 2, name: "Acrylic Photo Print", category: "photo", description: "High-definition double-sided printing, crystal clear finish. Comes with an adorable mini stand.", icon: "🖼️", material: "Premium acrylic + UV protection" },
    { id: 3, name: "Macaron Sticky Notes", category: "stationery", description: "Three-color inner pages, tearable design, soft pastel cover for daily jottings.", icon: "🍬", material: "Recycled adhesive paper" },
    { id: 4, name: "Polaroid Style Prints", category: "photo", description: "Vintage white or pink border available. Each photo becomes a little memory. Set of 6.", icon: "📸", material: "Matte finish · archival quality" },
    { id: 5, name: "Pink Art Poster", category: "poster", description: "Watercolor florals / abstract sweet series. A2 size, matte paper, includes poster tube.", icon: "🎨", material: "Heavyweight matte 200gsm" },
    { id: 6, name: "Handmade Pop-up Card", category: "cards", description: "Handcrafted 3D pop-up surprise, customizable message inside. Perfect for birthdays.", icon: "💌", material: "Hand-assembled with love" },
    { id: 7, name: "Textured Postcard Set", category: "cards", description: "8 unique designs, cotton paper texture with hand-drawn romantic style.", icon: "📮", material: "100% cotton rag paper" },
    { id: 8, name: "Wall Art Print", category: "poster", description: "Nordic minimalist pink illustrations, perfect for modern interiors.", icon: "🖌️", material: "Archival ink · FSC-certified" },
    { id: 9, name: "Cute Sticker Pack", category: "stationery", description: "Waterproof PET stickers. 20 mixed designs including desserts and animals.", icon: "✨", material: "Vinyl waterproof + glossy" },
    { id: 10, name: "Polaroid Photo Album", category: "photo", description: "Self-adhesive corners, holds up to 40 polaroids. Moisture-resistant cover.", icon: "📓", material: "Linen hardcover + acid-free pages" },
    { id: 11, name: "Starry Invitation Card", category: "cards", description: "Shimmering starry sky theme, fold-out design. Great for parties/gatherings.", icon: "🌙", material: "Glitter finish + foil accents" },
    { id: 12, name: "Hand-drawn Wall Calendar", category: "poster", description: "2026 pink-themed calendar, each month features a different illustration.", icon: "📅", material: "Thick matte paper · spiral binding" }
  ];

  const productsGrid = document.getElementById('productsGrid');
  let currentFilter = 'all';
  let currentSearch = '';

  function getCategoryLabel(cat) {
    const map = { stationery: 'Stationery', poster: 'Art Poster', photo: 'Photo Print', cards: 'Greeting Card' };
    return map[cat] || 'Special';
  }

  function getIconClass(emoji) {
    const map = { '🌸':'fa-leaf', '🖼️':'fa-image', '🍬':'fa-candy-cane', '📸':'fa-camera', '🎨':'fa-palette', '💌':'fa-heart', '📮':'fa-envelope', '🖌️':'fa-paintbrush', '✨':'fa-star', '📓':'fa-book', '🌙':'fa-moon', '📅':'fa-calendar-alt' };
    return map[emoji] || 'fa-feather-alt';
  }

  function filterProducts() {
    let filtered = products;
    if (currentFilter !== 'all') filtered = filtered.filter(p => p.category === currentFilter);
    if (currentSearch.trim() !== '') {
      const search = currentSearch.toLowerCase();
      filtered = filtered.filter(p => p.name.toLowerCase().includes(search) || p.description.toLowerCase().includes(search));
    }
    return filtered;
  }

  function renderProducts() {
    const filtered = filterProducts();
    document.getElementById('productCount').innerText = filtered.length;

    if (filtered.length === 0) {
      productsGrid.innerHTML = `<div class="no-products"><i class="fas fa-cloud-moon" style="font-size: 2rem; margin-bottom: 0.8rem; display: block;"></i> Ohh, no cuties here ~ Try another category 💖</div>`;
      return;
    }

    productsGrid.innerHTML = filtered.map((product, idx) => {
      const catLabel = getCategoryLabel(product.category);
      const iconClass = getIconClass(product.icon);
      return `
        <div class="product-card" data-id="${product.id}" style="animation-delay: ${(idx % 10) * 0.02}s">
          <div class="card-img">
            <i class="fas ${iconClass} preview-icon"></i>
            <span style="font-size: 2rem;">${product.icon}</span>
            <div class="category-badge-img">${catLabel}</div>
          </div>
          <div class="card-content">
            <div class="product-title">
              <span>${escapeHtml(product.name)}</span>
              <span class="badge-category">${catLabel}</span>
            </div>
            <div class="product-desc">${escapeHtml(product.description.substring(0, 90))}${product.description.length > 90 ? '…' : ''}</div>
            <div class="action-row">
              <button class="detail-link" data-id="${product.id}"><i class="fas fa-eye"></i> View details</button>
            </div>
          </div>
        </div>
      `;
    }).join('');

    // attach event: full card click + detail button both work (no double modal)
    document.querySelectorAll('.product-card').forEach(card => {
      const prodId = parseInt(card.getAttribute('data-id'));
      card.addEventListener('click', (e) => {
        // avoid if click originated from detail-link button already (to prevent duplicate)
        if (e.target.closest('.detail-link')) return;
        const product = products.find(p => p.id === prodId);
        if (product) openProductModal(product);
      });
      const detailBtn = card.querySelector('.detail-link');
      if (detailBtn) {
        detailBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const product = products.find(p => p.id === prodId);
          if (product) openProductModal(product);
        });
      }
    });
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function openProductModal(product) {
    const iconClass = getIconClass(product.icon);
    document.getElementById('modalIcon').innerHTML = `<i class="fas ${iconClass}" style="font-size: 2.8rem; color: #e75480;"></i> <span style="font-size: 1.8rem;">${product.icon}</span>`;
    document.getElementById('modalName').innerText = product.name;
    document.getElementById('modalCategory').innerText = getCategoryLabel(product.category);
    document.getElementById('modalDesc').innerText = product.description;
    document.getElementById('modalFeature').innerHTML = `<i class="fas fa-crown"></i> ${product.material || 'Premium quality'} · Ready to ship worldwide + personalization`;
    modalOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  const modalOverlay = document.getElementById('productModal');
  function closeModal() {
    modalOverlay.classList.remove('active');
    document.body.style.overflow = '';
  }

  function initFiltersAndSearch() {
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const filterValue = btn.getAttribute('data-filter');
        if (!filterValue || currentFilter === filterValue) return;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = filterValue;
        renderProducts();
      });
    });

    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', (e) => {
      currentSearch = e.target.value;
      renderProducts();
    });
  }

  // dark mode toggle with class on body
  const darkToggle = document.getElementById('darkModeToggle');
  darkToggle.addEventListener('click', () => {
    document.body.classList.toggle('dark');
    const icon = darkToggle.querySelector('i');
    if (document.body.classList.contains('dark')) {
      icon.classList.remove('fa-moon');
      icon.classList.add('fa-sun');
      darkToggle.innerHTML = '<i class="fas fa-sun"></i> Light';
    } else {
      icon.classList.remove('fa-sun');
      icon.classList.add('fa-moon');
      darkToggle.innerHTML = '<i class="fas fa-moon"></i> Dark';
    }
  });

  document.getElementById('closeModalBtn').addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModal(); });

  renderProducts();
  initFiltersAndSearch();
</script>
</body>
</html>
